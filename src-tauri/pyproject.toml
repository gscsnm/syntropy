[project]
name = "syntropy"
version = "0.1.4"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "you" }
]
requires-python = ">=3.9"
dependencies = [
    "pytauri == 0.8.*",
    "pydantic == 2.*",
    "anyio == 4.*",
    "sqlmodel",
    "pandas",
    "akshare",
    "ddgs",
    "python-dotenv",
    "sqlalchemy",
    "agno>=2.3.21",
    "openai>=2.14.0",
    "fastapi>=0.128.0",
    "crawl4ai>=0.7.4",
    "ddgs>=9.5.2",
    "newspaper4k>=0.9.3.1",
    "lxml-html-clean>=0.4.3",
]

[project.entry-points.pytauri]
ext_mod = "syntropy.ext_mod"

[build-system]
requires = ["setuptools >= 80", "setuptools-scm >= 8", "Cython >= 3, < 4"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages]
find = { where = ["src-python"], namespaces = true }
