name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            download_py: bash scripts/macos/download-py.sh
            build_cmd: bash scripts/macos/build.sh
          - os: windows-2022
            download_py: pwsh scripts/windows/download-py.ps1
            build_cmd: pwsh scripts/windows/build.ps1

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Enable Corepack
        run: corepack enable

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Node dependencies
        run: pnpm install

      - name: Download portable Python
        run: ${{ matrix.download_py }}

      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ${{ matrix.build_cmd }}

      - name: Prepare release artifacts (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts

          search_roots=(target src-tauri/target)
          dmg_path=""
          for root in "${search_roots[@]}"; do
            if [[ -d "${root}" ]]; then
              dmg_path="$(find "${root}" -type f -path "*/bundle/dmg/*.dmg" | head -n 1)"
            fi
            if [[ -n "${dmg_path}" ]]; then
              break
            fi
          done
          if [[ -z "${dmg_path}" ]]; then
            for root in "${search_roots[@]}"; do
              if [[ -d "${root}" ]]; then
                find "${root}" -maxdepth 5 -type d -print
                find "${root}" -maxdepth 8 -type f -name "*.dmg" -print
              fi
            done
            echo "DMG artifact not found."
            exit 1
          fi

          updater_path=""
          for root in "${search_roots[@]}"; do
            if [[ -d "${root}" ]]; then
              updater_path="$(find "${root}" -type f -path "*/bundle/macos/*.app.tar.gz" | head -n 1)"
            fi
            if [[ -n "${updater_path}" ]]; then
              break
            fi
          done
          if [[ -z "${updater_path}" ]]; then
            for root in "${search_roots[@]}"; do
              if [[ -d "${root}" ]]; then
                find "${root}" -maxdepth 8 -type f -path "*/bundle/macos/*.tar.gz" -print
              fi
            done
            echo "Updater artifact (.app.tar.gz) not found. Ensure 'app' target is enabled."
            exit 1
          fi

          updater_sig="${updater_path}.sig"
          if [[ ! -f "${updater_sig}" ]]; then
            updater_sig=""
            for root in "${search_roots[@]}"; do
              if [[ -d "${root}" ]]; then
                updater_sig="$(find "${root}" -type f -path "*/bundle/macos/*.sig" | head -n 1)"
              fi
              if [[ -n "${updater_sig}" ]]; then
                break
              fi
            done
          fi
          if [[ -z "${updater_sig}" || ! -f "${updater_sig}" ]]; then
            for root in "${search_roots[@]}"; do
              if [[ -d "${root}" ]]; then
                find "${root}" -maxdepth 8 -type f -name "*.sig" -print
              fi
            done
            echo "Updater signature (.sig) not found. Check TAURI signing secrets."
            exit 1
          fi

          cp "${dmg_path}" "${updater_path}" "${updater_sig}" release-artifacts/

          version="${GITHUB_REF_NAME#v}"
          dmg_name="$(basename "${dmg_path}")"
          updater_name="$(basename "${updater_path}")"
          updater_sig_name="$(basename "${updater_sig}")"
          updater_url="https://updates.ofo.me/syntropy/releases/download/${GITHUB_REF_NAME}/${updater_name}"

          python3 scripts/python/gen_updater_latest_json.py \
            --version "${version}" \
            --out "release-artifacts/latest-darwin-aarch64.json" \
            --add "darwin-aarch64" "release-artifacts/${updater_name}" "release-artifacts/${updater_sig_name}" "${updater_url}"

      - name: Prepare release artifacts (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

          $roots = @("target", "src-tauri/target")
          $msi = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $msi = Get-ChildItem -Path $root -Recurse -Filter "*.msi" | Where-Object { $_.FullName -match "\\bundle\\msi\\\\" } | Select-Object -First 1
            }
            if ($null -ne $msi) { break }
          }
          if ($null -eq $msi) { throw "MSI artifact not found." }

          $sig = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $sig = Get-ChildItem -Path $root -Recurse -Filter "*.sig" | Where-Object { $_.FullName -match "\\bundle\\msi\\\\" } | Select-Object -First 1
            }
            if ($null -ne $sig) { break }
          }
          if ($null -eq $sig) { throw "MSI signature (.sig) not found. Check signing secrets." }

          Copy-Item $msi.FullName -Destination "release-artifacts/$($msi.Name)" -Force
          Copy-Item $sig.FullName -Destination "release-artifacts/$($sig.Name)" -Force

          $version = ($env:GITHUB_REF_NAME -replace '^v', '')
          $url = "https://updates.ofo.me/syntropy/releases/download/$env:GITHUB_REF_NAME/$($msi.Name)"

          python scripts/python/gen_updater_latest_json.py `
            --version "$version" `
            --out "release-artifacts/latest-windows-x86_64.json" `
            --add "windows-x86_64" "release-artifacts/$($msi.Name)" "release-artifacts/$($sig.Name)" "$url"

      - name: Upload assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
