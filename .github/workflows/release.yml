name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build and upload assets for (e.g. v0.1.6)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    env:
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            download_py: bash scripts/macos/download-py.sh
            build_cmd: bash scripts/macos/build.sh
            macos_arch: aarch64
            updater_target: darwin-aarch64
            dmg_suffix: macos-aarch64
          - os: macos-15-intel
            download_py: bash scripts/macos/download-py.sh
            build_cmd: bash scripts/macos/build.sh
            macos_arch: x86_64
            updater_target: darwin-x86_64
            dmg_suffix: macos-x86_64
          - os: windows-2022
            download_py: pwsh scripts/windows/download-py.ps1
            build_cmd: pwsh scripts/windows/build.ps1

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Enable Corepack
        run: corepack enable

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install Node dependencies
        run: pnpm install

      - name: Download portable Python
        run: ${{ matrix.download_py }}

      - name: Build bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: ${{ matrix.build_cmd }}

      - name: Prepare release artifacts (macOS)
        if: runner.os == 'macOS' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && env.RELEASE_TAG != ''))
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-artifacts
          macos_arch="${{ matrix.macos_arch }}"
          updater_target="${{ matrix.updater_target }}"
          dmg_suffix="${{ matrix.dmg_suffix }}"

          search_roots=(target src-tauri/target)
          dmg_path=""
          for root in "${search_roots[@]}"; do
            if [[ -d "${root}" ]]; then
              dmg_path="$(find "${root}" -type f -path "*/bundle/dmg/*.dmg" | head -n 1)"
            fi
            if [[ -n "${dmg_path}" ]]; then
              break
            fi
          done
          if [[ -z "${dmg_path}" ]]; then
            for root in "${search_roots[@]}"; do
              if [[ -d "${root}" ]]; then
                find "${root}" -maxdepth 5 -type d -print
                find "${root}" -maxdepth 8 -type f -name "*.dmg" -print
              fi
            done
            echo "DMG artifact not found."
            exit 1
          fi

          updater_path=""
          for root in "${search_roots[@]}"; do
            if [[ -d "${root}" ]]; then
              updater_path="$(find "${root}" -type f -path "*/bundle/macos/*.app.tar.gz" | head -n 1)"
            fi
            if [[ -n "${updater_path}" ]]; then
              break
            fi
          done
          if [[ -z "${updater_path}" ]]; then
            for root in "${search_roots[@]}"; do
              if [[ -d "${root}" ]]; then
                find "${root}" -maxdepth 8 -type f -path "*/bundle/macos/*.tar.gz" -print
              fi
            done
            echo "Updater artifact (.app.tar.gz) not found. Ensure 'app' target is enabled."
            exit 1
          fi

          updater_sig="${updater_path}.sig"
          if [[ ! -f "${updater_sig}" ]]; then
            updater_sig=""
            for root in "${search_roots[@]}"; do
              if [[ -d "${root}" ]]; then
                updater_sig="$(find "${root}" -type f -path "*/bundle/macos/*.sig" | head -n 1)"
              fi
              if [[ -n "${updater_sig}" ]]; then
                break
              fi
            done
          fi
          if [[ -z "${updater_sig}" || ! -f "${updater_sig}" ]]; then
            for root in "${search_roots[@]}"; do
              if [[ -d "${root}" ]]; then
                find "${root}" -maxdepth 8 -type f -name "*.sig" -print
              fi
            done
            echo "Updater signature (.sig) not found. Check TAURI signing secrets."
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          current_tag="${RELEASE_TAG}"
          prev_tag="$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)"
          if [[ -n "${prev_tag}" ]]; then
            notes="$(git log "${prev_tag}..${current_tag}" --pretty=format:"- %s")"
          else
            notes="$(git log -1 --pretty=%B)"
          fi
          dmg_target_name="Syntropy-${version}-${dmg_suffix}.dmg"
          cp "${dmg_path}" "release-artifacts/${dmg_target_name}"
          cp "${updater_path}" "${updater_sig}" release-artifacts/
          dmg_name="${dmg_target_name}"
          updater_name="$(basename "${updater_path}")"
          updater_sig_name="$(basename "${updater_sig}")"
          updater_url="https://updates.ofo.me/syntropy/releases/download/${RELEASE_TAG}/${updater_name}"

          python3 scripts/python/gen_updater_latest_json.py \
            --version "${version}" \
            --notes "${notes}" \
            --out "release-artifacts/latest-${updater_target}.json" \
            --add "${updater_target}" "release-artifacts/${updater_name}" "release-artifacts/${updater_sig_name}" "${updater_url}"

      - name: Prepare release artifacts (Windows)
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && env.RELEASE_TAG != ''))
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null

          $roots = @("target", "src-tauri/target")
          $msi = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $msi = Get-ChildItem -Path $root -Recurse -Filter "*.msi" | Where-Object { $_.FullName -like "*\bundle\msi\*" } | Select-Object -First 1
            }
            if ($null -ne $msi) { break }
          }
          if ($null -eq $msi) { throw "MSI artifact not found." }

          $sig = $null
          foreach ($root in $roots) {
            if (Test-Path $root) {
              $sig = Get-ChildItem -Path $root -Recurse -Filter "*.sig" | Where-Object { $_.FullName -like "*\bundle\msi\*" } | Select-Object -First 1
            }
            if ($null -ne $sig) { break }
          }
          if ($null -eq $sig) { throw "MSI signature (.sig) not found. Check signing secrets." }

          Copy-Item $msi.FullName -Destination "release-artifacts/$($msi.Name)" -Force
          Copy-Item $sig.FullName -Destination "release-artifacts/$($sig.Name)" -Force

          $version = ($env:RELEASE_TAG -replace '^v', '')
          $url = "https://updates.ofo.me/syntropy/releases/download/$env:RELEASE_TAG/$($msi.Name)"
          $currentTag = $env:RELEASE_TAG
          $prevTag = git describe --tags --abbrev=0 "$currentTag^" 2>$null
          if ($prevTag) {
            $notes = git log "$prevTag..$currentTag" --pretty=format:"- %s"
          } else {
            $notes = git log -1 --pretty=%B
          }
          if ($notes -is [array]) { $notes = $notes -join "`n" }

          python scripts/python/gen_updater_latest_json.py `
            --version "$version" `
            --notes "$notes" `
            --out "release-artifacts/latest-windows-x86_64.json" `
            --add "windows-x86_64" "release-artifacts/$($msi.Name)" "release-artifacts/$($sig.Name)" "$url"

      - name: Upload assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && env.RELEASE_TAG != '')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          tag_name: ${{ env.RELEASE_TAG }}
